name: CI
run-name: CI - ${{ github.event_name }} - ${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: CI - change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      event_name: ${{ steps.scope.outputs.event_name }}
      validation_stage: ${{ steps.scope.outputs.validation_stage }}
      reason: ${{ steps.scope.outputs.reason }}
      native_check: ${{ steps.scope.outputs.native_check }}
      network_check: ${{ steps.scope.outputs.network_check }}
      applications_check: ${{ steps.scope.outputs.applications_check }}
      database_check: ${{ steps.scope.outputs.database_check }}
      format_check: ${{ steps.scope.outputs.format_check }}
      docs_check: ${{ steps.scope.outputs.docs_check }}
      readme_check: ${{ steps.scope.outputs.readme_check }}
      site_available: ${{ steps.scope.outputs.site_available }}
      files_known: ${{ steps.scope.outputs.files_known }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Test CI scope and result rules
        run: node --test tests/ci/*.test.mjs
      - name: Classify the exact event commits
        id: scope
        run: node .github/scripts/ci-policy.mjs classify
  validation:
    name: CI - lightweight validation
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      documentation_outcome: ${{ steps.documentation.outcome }}
      readme_outcome: ${{ steps.readme.outcome }}
      formatting_outcome: ${{ steps.formatting.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: ${{ needs.scope.outputs.docs_check != 'false' && needs.scope.outputs.site_available == 'true' && 'npm' || '' }}
          cache-dependency-path: docs/site/package-lock.json
      - name: Validate Nimbus documentation
        id: documentation
        if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_check != 'false') }}
        run: |
          node .github/scripts/ci-policy.mjs require-site
          npm ci --prefix docs/site
          npm run check --prefix docs/site
      - name: Check README file links
        id: readme
        if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.readme_check != 'false') }}
        run: node .github/scripts/check-readme-links.mjs
      - name: Ensure clang-format 18 is available
        if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.format_check != 'false') }}
        run: |
          if ! command -v clang-format-18 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang-format-18
          fi
          clang-format-18 --version
      - name: Check tracked source formatting
        id: formatting
        if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.format_check != 'false') }}
        run: CLANG_FORMAT=clang-format-18 bash scripts/format.sh --check
  network:
    name: Network - ${{ matrix.os }} - Boost - ${{ matrix.sanitizer }}
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.network_check != 'false') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && needs.scope.result == 'success' && needs.scope.outputs.validation_stage == 'modules' && '{"include":[{"os":"ubuntu-latest","sanitizer":"none"}]}' || '{"include":[{"os":"ubuntu-latest","sanitizer":"none"},{"os":"macos-latest","sanitizer":"none"},{"os":"windows-latest","sanitizer":"none"},{"os":"ubuntu-latest","sanitizer":"address"},{"os":"ubuntu-latest","sanitizer":"thread"}]}') }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned dependencies
        run: git submodule update --init 3rdparty/args 3rdparty/spdlog 3rdparty/readerwriterqueue
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Prepare vcpkg binary cache
        id: vcpkg-cache
        env:
          VCPKG_CACHE_REVISION: 0699a19d0c6386247ce50d4dedbb8217d484d536
          VCPKG_CACHE_FEATURES: boost
          VCPKG_CACHE_DEFAULT_FEATURES: 'true'
          VCPKG_CACHE_PROFILE: network-${{ matrix.sanitizer }}
        run: node .github/scripts/vcpkg-cache.mjs
      - name: Restore vcpkg package archives
        id: vcpkg-restore
        if: steps.vcpkg-cache.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.directory }}
          key: ${{ steps.vcpkg-cache.outputs.key }}
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 0699a19d0c6386247ce50d4dedbb8217d484d536
          vcpkgJsonGlob: vcpkg.json
      - name: Configure TSan address space
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure network regressions
        shell: pwsh
        run: >-
          cmake -S . -B ci-build -G Ninja
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_FEATURES=boost
          -DCMAKE_BUILD_TYPE=Debug
          -DARK_BUILD_APPLICATIONS=OFF
          -DARK_BUILD_NETWORK_TESTS=ON
          -DASIO_STANDALONE=OFF
          ${{ matrix.sanitizer == 'address' && '"-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"' || matrix.sanitizer == 'thread' && '"-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"' || '' }}
      - name: Save vcpkg package archives
        if: ${{ success() && steps.vcpkg-cache.outputs.enabled == 'true' && steps.vcpkg-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.directory }}
          key: ${{ steps.vcpkg-cache.outputs.key }}
      - run: cmake --build ci-build --parallel 2
      - name: Run network regressions
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: cmake --build ci-build --target check-network
  applications:
    name: Applications - ${{ matrix.os }} - C++20
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.applications_check != 'false') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && needs.scope.result == 'success' && needs.scope.outputs.validation_stage == 'modules' && '{"include":[{"os":"ubuntu-latest"}]}' || '{"include":[{"os":"ubuntu-latest"},{"os":"macos-latest"},{"os":"windows-latest"}]}') }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned dependencies
        run: git submodule update --init 3rdparty/args 3rdparty/spdlog 3rdparty/readerwriterqueue
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Prepare vcpkg binary cache
        id: vcpkg-cache
        env:
          VCPKG_CACHE_REVISION: 0699a19d0c6386247ce50d4dedbb8217d484d536
          VCPKG_CACHE_FEATURES: 'application;boost'
          VCPKG_CACHE_DEFAULT_FEATURES: 'true'
          VCPKG_CACHE_PROFILE: applications
        run: node .github/scripts/vcpkg-cache.mjs
      - name: Restore vcpkg package archives
        id: vcpkg-restore
        if: steps.vcpkg-cache.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.directory }}
          key: ${{ steps.vcpkg-cache.outputs.key }}
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 0699a19d0c6386247ce50d4dedbb8217d484d536
          vcpkgJsonGlob: vcpkg.json
      - name: Configure applications
        shell: pwsh
        run: >-
          cmake -S . -B ci-build -G Ninja
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_MANIFEST_FEATURES=application;boost"
          -DCMAKE_BUILD_TYPE=Debug
          ${{ runner.os == 'Windows' && '-DVCPKG_APPLOCAL_DEPS=OFF' || '' }}
          -DARK_BUILD_APPLICATIONS=ON
          -DARK_BUILD_PROTO=ON
          -DARK_BUILD_TESTS=ON
          -DARK_BUILD_CORE_TESTS=ON
          -DARK_BUILD_EXAMPLES=ON
          -DASIO_STANDALONE=OFF
      - name: Save vcpkg package archives
        if: ${{ success() && steps.vcpkg-cache.outputs.enabled == 'true' && steps.vcpkg-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.directory }}
          key: ${{ steps.vcpkg-cache.outputs.key }}
      - name: Set Windows dependency runtime PATH
        if: runner.os == 'Windows'
        run: cmake -DBUILD_DIR=ci-build -P .github/scripts/windows-runtime.cmake
      - run: cmake --build ci-build --parallel 2
      - name: Run core and Protobuf regressions
        run: cmake --build ci-build --target check-core
  database:
    name: Database - ${{ matrix.os }} - ${{ matrix.asio }}
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.database_check != 'false') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && needs.scope.result == 'success' && needs.scope.outputs.validation_stage == 'modules' && '{"include":[{"os":"ubuntu-latest","asio":"Boost","standalone":"OFF","features":"database;boost"}]}' || '{"include":[{"os":"ubuntu-latest","asio":"Boost","standalone":"OFF","features":"database;boost"},{"os":"ubuntu-latest","asio":"Standalone","standalone":"ON","features":"database"},{"os":"macos-latest","asio":"Boost","standalone":"OFF","features":"database;boost"},{"os":"windows-latest","asio":"Boost","standalone":"OFF","features":"database;boost"}]}') }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned dependencies
        run: git submodule update --init 3rdparty/args 3rdparty/spdlog 3rdparty/readerwriterqueue
      - name: Check out pinned arknet for database development tests
        uses: actions/checkout@v4
        with:
          repository: OpenArkStudio/arknet
          ref: c5432ca176edf9f4c06db03713f03764184c5cea
          path: ci-arknet
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Prepare vcpkg binary cache
        id: vcpkg-cache
        env:
          VCPKG_CACHE_REVISION: 0699a19d0c6386247ce50d4dedbb8217d484d536
          VCPKG_CACHE_FEATURES: ${{ matrix.features }}
          VCPKG_CACHE_DEFAULT_FEATURES: 'false'
          VCPKG_CACHE_PROFILE: database-${{ matrix.asio }}
        run: node .github/scripts/vcpkg-cache.mjs
      - name: Restore vcpkg package archives
        id: vcpkg-restore
        if: steps.vcpkg-cache.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.directory }}
          key: ${{ steps.vcpkg-cache.outputs.key }}
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 0699a19d0c6386247ce50d4dedbb8217d484d536
          vcpkgJsonGlob: vcpkg.json
      - name: Configure native database development tests
        shell: pwsh
        run: >-
          cmake -S . -B ci-database -G Ninja
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          "-DVCPKG_MANIFEST_FEATURES=${{ matrix.features }}"
          -DCMAKE_BUILD_TYPE=Debug
          -DARK_BUILD_APPLICATIONS=OFF
          -DARK_BUILD_PROTO=OFF
          -DARK_BUILD_TESTS=OFF
          -DARK_BUILD_CORE_TESTS=OFF
          -DARK_BUILD_EXAMPLES=OFF
          -DARK_BUILD_DATABASE_TESTS=ON
          -DARK_BUILD_DATABASE_BENCHMARKS=ON
          "-DARKNET_SOURCE_DIR=$env:GITHUB_WORKSPACE/ci-arknet"
          -DARKNET_ENABLE_SSL=ON
          -DASIO_STANDALONE=${{ matrix.standalone }}
      - name: Save vcpkg package archives
        if: ${{ success() && steps.vcpkg-cache.outputs.enabled == 'true' && steps.vcpkg-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.directory }}
          key: ${{ steps.vcpkg-cache.outputs.key }}
      - name: Compile native services and coroutine tests
        run: cmake --build ci-database --parallel 2
      - name: Run local database lifetime regressions
        run: cmake --build ci-database --target check-database
      - name: Run local database benchmark self-tests
        run: cmake --build ci-database --target check-database-benchmark
  required:
    name: CI - required
    if: always()
    needs: [scope, network, applications, database, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Require successful builds and regressions
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-policy.mjs gate
