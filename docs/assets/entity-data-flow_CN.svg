<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">从定义到运行时数据</title>
  <desc id="desc">元数据在 init 阶段加载，静态配置在 post_init 加载，创建实体时将默认值与显式参数合并，再在当前调用路径分发事件。持久化与网络同步由应用决定。</desc>
  <style>
    .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.boundary{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.body,.heading,.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}.body{font-size:20px}.heading{font-size:25px;font-weight:650}.muted{font-size:17px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3}.dashed{stroke-dasharray:7 5}.arrowhead{fill:#64748b}
    @media(prefers-color-scheme:dark){.canvas{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8}.accent{fill:#312e81;stroke:#a5b4fc}.body,.heading{fill:#f1f5f9}.muted{fill:#cbd5e1}.arrow{stroke:#94a3b8}.arrowhead{fill:#94a3b8}.boundary{stroke:#64748b}}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" class="arrowhead"/></marker></defs>
  <rect width="640" height="730" rx="16" class="canvas"/>
  <text x="320" y="40" class="heading" text-anchor="middle"><tspan x="320" dy="0">从定义到运行时数据</tspan></text>
  <rect x="45" y="95" width="550" height="90" rx="12" class="box"/><text x="320" y="134" class="body" text-anchor="middle"><tspan x="320" dy="0">定义 XML → class_meta_module</tspan><tspan x="320" dy="26">init()：字段、类型、索引与标记</tspan></text><path d="M320 185 V235" class="arrow" marker-end="url(#arrow)"/><rect x="45" y="235" width="550" height="90" rx="12" class="box"/><text x="320" y="274" class="body" text-anchor="middle"><tspan x="320" dy="0">值 XML → config_module</tspan><tspan x="320" dy="26">post_init()：静态配置记录</tspan></text><path d="M320 325 V375" class="arrow" marker-end="url(#arrow)"/><rect x="45" y="375" width="550" height="100" rx="12" class="accent"/><text x="320" y="419" class="body" text-anchor="middle"><tspan x="320" dy="0">kernel_module::create_entity()</tspan><tspan x="320" dy="26">定义 + 可选默认值 + 显式参数</tspan></text><path d="M320 475 V525" class="arrow" marker-end="url(#arrow)"/><rect x="45" y="525" width="550" height="95" rx="12" class="box"/><text x="320" y="566.5" class="body" text-anchor="middle"><tspan x="320" dy="0">实体事件 → 业务回调</tspan><tspan x="320" dy="26">在当前调用路径同步执行</tspan></text><text x="320" y="680" class="muted" text-anchor="middle"><tspan x="320" dy="0">持久化与网络同步：应用策略</tspan></text>
</svg>
