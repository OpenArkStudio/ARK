<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Historical data-model sketch</title>
  <desc id="desc">The draft separates entity and configuration metadata at class and field level. A proposed value refers to metadata and a parent relation, with scalar and nested forms. Ownership and migration are open; this is not a current runtime API.</desc>
  <style>
    .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.boundary{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.body,.heading,.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}.body{font-size:20px}.heading{font-size:25px;font-weight:650}.muted{font-size:17px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3}.dashed{stroke-dasharray:7 5}.arrowhead{fill:#64748b}
    @media(prefers-color-scheme:dark){.canvas{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8}.accent{fill:#312e81;stroke:#a5b4fc}.body,.heading{fill:#f1f5f9}.muted{fill:#cbd5e1}.arrow{stroke:#94a3b8}.arrowhead{fill:#94a3b8}.boundary{stroke:#64748b}}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" class="arrowhead"/></marker></defs>
  <rect width="640" height="780" rx="16" class="canvas"/>
  <text x="320" y="40" class="heading" text-anchor="middle"><tspan x="320" dy="0">Historical data-model sketch</tspan></text>
  <text x="320" y="82" class="muted" text-anchor="middle"><tspan x="320" dy="0">Draft concept, not a runtime API</tspan></text><rect x="25" y="135" width="280" height="125" rx="12" class="box"/><text x="165" y="178.5" class="body" text-anchor="middle"><tspan x="165" dy="0">Entity metadata</tspan><tspan x="165" dy="26">Class and field definitions</tspan><tspan x="165" dy="26">Types, masks and hooks</tspan></text><rect x="335" y="135" width="280" height="125" rx="12" class="box"/><text x="475" y="178.5" class="body" text-anchor="middle"><tspan x="475" dy="0">Configuration metadata</tspan><tspan x="475" dy="26">Class and field definitions</tspan><tspan x="475" dy="26">Types and references</tspan></text><path d="M165 260 V305 H260 V350" class="arrow" marker-end="url(#arrow)"/><path d="M475 260 V305 H380 V350" class="arrow" marker-end="url(#arrow)"/><rect x="155" y="350" width="330" height="95" rx="12" class="accent"/><text x="320" y="391.5" class="body" text-anchor="middle"><tspan x="320" dy="0">Proposed value</tspan><tspan x="320" dy="26">Metadata + parent relation</tspan></text><path d="M320 445 V495 H165 V540" class="arrow" marker-end="url(#arrow)"/><path d="M320 495 H475 V540" class="arrow" marker-end="url(#arrow)"/><rect x="25" y="540" width="280" height="125" rx="12" class="box"/><text x="165" y="583.5" class="body" text-anchor="middle"><tspan x="165" dy="0">Scalar forms</tspan><tspan x="165" dy="26">Boolean / enum</tspan><tspan x="165" dy="26">Numbers / strings</tspan></text><rect x="335" y="540" width="280" height="125" rx="12" class="box"/><text x="475" y="596.5" class="body" text-anchor="middle"><tspan x="475" dy="0">Nested forms</tspan><tspan x="475" dy="26">Structure / array / table</tspan></text><text x="320" y="730" class="muted" text-anchor="middle"><tspan x="320" dy="0">Ownership, validation and migration remain open</tspan></text>
</svg>
