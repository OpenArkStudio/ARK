<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">From definitions to runtime data</title>
  <desc id="desc">Metadata loads during init and static records during post_init. Entity creation combines defaults with explicit arguments, then dispatches events in the calling path. Persistence and replication are application policy.</desc>
  <style>
    .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.boundary{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.body,.heading,.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}.body{font-size:20px}.heading{font-size:25px;font-weight:650}.muted{font-size:17px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3}.dashed{stroke-dasharray:7 5}.arrowhead{fill:#64748b}
    @media(prefers-color-scheme:dark){.canvas{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8}.accent{fill:#312e81;stroke:#a5b4fc}.body,.heading{fill:#f1f5f9}.muted{fill:#cbd5e1}.arrow{stroke:#94a3b8}.arrowhead{fill:#94a3b8}.boundary{stroke:#64748b}}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" class="arrowhead"/></marker></defs>
  <rect width="640" height="730" rx="16" class="canvas"/>
  <text x="320" y="40" class="heading" text-anchor="middle"><tspan x="320" dy="0">From definitions to runtime data</tspan></text>
  <rect x="45" y="95" width="550" height="90" rx="12" class="box"/><text x="320" y="134" class="body" text-anchor="middle"><tspan x="320" dy="0">Schema XML → class_meta_module</tspan><tspan x="320" dy="26">init(): fields, types, indices and masks</tspan></text><path d="M320 185 V235" class="arrow" marker-end="url(#arrow)"/><rect x="45" y="235" width="550" height="90" rx="12" class="box"/><text x="320" y="274" class="body" text-anchor="middle"><tspan x="320" dy="0">Value XML → config_module</tspan><tspan x="320" dy="26">post_init(): static configuration records</tspan></text><path d="M320 325 V375" class="arrow" marker-end="url(#arrow)"/><rect x="45" y="375" width="550" height="100" rx="12" class="accent"/><text x="320" y="419" class="body" text-anchor="middle"><tspan x="320" dy="0">kernel_module::create_entity()</tspan><tspan x="320" dy="26">Schema + optional defaults + explicit args</tspan></text><path d="M320 475 V525" class="arrow" marker-end="url(#arrow)"/><rect x="45" y="525" width="550" height="95" rx="12" class="box"/><text x="320" y="566.5" class="body" text-anchor="middle"><tspan x="320" dy="0">Entity events → business handlers</tspan><tspan x="320" dy="26">Synchronous in the calling path</tspan></text><text x="320" y="680" class="muted" text-anchor="middle"><tspan x="320" dy="0">Persistence and replication: application policy</tspan></text>
</svg>
