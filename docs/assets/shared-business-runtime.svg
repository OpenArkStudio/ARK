<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc"><title id="title">Module tasks and the shared business executor</title><desc id="desc">All groups share one handler budget; native IO workers do not directly resume business coroutines.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#496d96"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#19324d;font-size:15px}.small{font-size:12px;fill:#46617b}.box{fill:#f5f8fc;stroke:#7694b5;stroke-width:1.5}.arrow{fill:none;stroke:#496d96;stroke-width:1.8;marker-end:url(#arrow)}</style><rect x="260" y="22" width="680" height="182" rx="12" fill="#edf5ff" stroke="#7694b5"/><text x="280" y="51">ark main loop / owner thread</text><rect class="box" x="15" y="83" width="184" height="100" rx="10"/><text x="107" y="121" text-anchor="middle">arknet native IO</text><text class="small" x="107" y="148" text-anchor="middle">Pool-owned workers</text><rect class="box" x="280" y="83" width="245" height="100" rx="10"/><text x="402" y="121" text-anchor="middle">Module update()</text><text class="small" x="402" y="148" text-anchor="middle">service.update() → bridge.dispatch()</text><rect class="box" x="565" y="83" width="185" height="100" rx="10"/><text x="657" y="121" text-anchor="middle">Shared manual_runtime</text><text class="small" x="657" y="148" text-anchor="middle">One bounded poll() per tick</text><rect class="box" x="790" y="83" width="130" height="100" rx="10"/><text x="855" y="121" text-anchor="middle">Module task groups</text><text class="small" x="855" y="148" text-anchor="middle">Resume co_await</text><path class="arrow" d="M199 133H280"/><text class="small" x="237" y="116" text-anchor="middle">Terminal result</text><path class="arrow" d="M525 133H565"/><path class="arrow" d="M750 133H790"/><text class="small" x="480" y="239" text-anchor="middle">All groups share one handler budget; native IO workers do not directly resume business coroutines.</text></svg>
