<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Entity data and definitions</title>
  <desc id="desc">Shared class metadata describes an entity. Runtime entities contain typed nodes, tables and containers; tables contain rows, while containers hold child entities with their own IDs.</desc>
  <style>
    .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.boundary{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.body,.heading,.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}.body{font-size:20px}.heading{font-size:25px;font-weight:650}.muted{font-size:17px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3}.dashed{stroke-dasharray:7 5}.arrowhead{fill:#64748b}
    @media(prefers-color-scheme:dark){.canvas{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8}.accent{fill:#312e81;stroke:#a5b4fc}.body,.heading{fill:#f1f5f9}.muted{fill:#cbd5e1}.arrow{stroke:#94a3b8}.arrowhead{fill:#94a3b8}.boundary{stroke:#64748b}}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" class="arrowhead"/></marker></defs>
  <rect width="640" height="760" rx="16" class="canvas"/>
  <text x="320" y="40" class="heading" text-anchor="middle"><tspan x="320" dy="0">Entity data and definitions</tspan></text>
  <rect x="155" y="90" width="330" height="90" rx="12" class="box"/><text x="320" y="129" class="body" text-anchor="middle"><tspan x="320" dy="0">class_meta</tspan><tspan x="320" dy="26">Shared definitions</tspan></text><path d="M320 180 V240" class="arrow" marker-end="url(#arrow)"/><rect x="155" y="240" width="330" height="90" rx="12" class="accent"/><text x="320" y="279" class="body" text-anchor="middle"><tspan x="320" dy="0">entity</tspan><tspan x="320" dy="26">Own ID and runtime state</tspan></text><path d="M320 330 V370 H115 V415" class="arrow" marker-end="url(#arrow)"/><path d="M320 370 V415" class="arrow" marker-end="url(#arrow)"/><path d="M320 370 H525 V415" class="arrow" marker-end="url(#arrow)"/><rect x="30" y="415" width="170" height="100" rx="12" class="box"/><text x="115" y="459" class="body" text-anchor="middle"><tspan x="115" dy="0">node</tspan><tspan x="115" dy="26">Typed value</tspan></text><rect x="235" y="415" width="170" height="100" rx="12" class="box"/><text x="320" y="459" class="body" text-anchor="middle"><tspan x="320" dy="0">table</tspan><tspan x="320" dy="26">Rows / columns</tspan></text><rect x="440" y="415" width="170" height="100" rx="12" class="box"/><text x="525" y="459" class="body" text-anchor="middle"><tspan x="525" dy="0">container</tspan><tspan x="525" dy="26">Children</tspan></text><path d="M320 515 V565" class="arrow" marker-end="url(#arrow)"/><path d="M525 515 V565" class="arrow" marker-end="url(#arrow)"/><rect x="235" y="565" width="170" height="85" rx="12" class="box"/><text x="320" y="601.5" class="body" text-anchor="middle"><tspan x="320" dy="0">row</tspan><tspan x="320" dy="26">Column nodes</tspan></text><rect x="440" y="565" width="170" height="85" rx="12" class="box"/><text x="525" y="601.5" class="body" text-anchor="middle"><tspan x="525" dy="0">entity</tspan><tspan x="525" dy="26">Child ID</tspan></text><text x="320" y="715" class="muted" text-anchor="middle"><tspan x="320" dy="0">Shared definitions; separate runtime values</tspan></text>
</svg>
