<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">参考进程拓扑</title>
  <desc id="desc">仅说明入口、集群共享服务、路由、区服和存储的职责。虚线为应用选择的连接关系，不声明已具备发现、复制或高可用。</desc>
  <style>
    .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.boundary{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.body,.heading,.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}.body{font-size:20px}.heading{font-size:25px;font-weight:650}.muted{font-size:17px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3}.dashed{stroke-dasharray:7 5}.arrowhead{fill:#64748b}
    @media(prefers-color-scheme:dark){.canvas{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8}.accent{fill:#312e81;stroke:#a5b4fc}.body,.heading{fill:#f1f5f9}.muted{fill:#cbd5e1}.arrow{stroke:#94a3b8}.arrowhead{fill:#94a3b8}.boundary{stroke:#64748b}}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" class="arrowhead"/></marker></defs>
  <rect width="640" height="780" rx="16" class="canvas"/>
  <text x="320" y="40" class="heading" text-anchor="middle"><tspan x="320" dy="0">参考进程拓扑</tspan></text>
  <text x="320" y="78" class="muted" text-anchor="middle"><tspan x="320" dy="0">职责参考，不是已完成的高可用部署</tspan></text><rect x="180" y="105" width="280" height="80" rx="12" class="box"/><text x="320" y="139" class="body" text-anchor="middle"><tspan x="320" dy="0">入口 / 目录</tspan><tspan x="320" dy="26">端点选择</tspan></text><rect x="35" y="255" width="260" height="90" rx="12" class="box"/><text x="165" y="294" class="body" text-anchor="middle"><tspan x="165" dy="0">集群共享服务</tspan><tspan x="165" dy="26">Master / shared logic</tspan></text><rect x="345" y="255" width="260" height="90" rx="12" class="box"/><text x="475" y="294" class="body" text-anchor="middle"><tspan x="475" dy="0">存储服务</tspan><tspan x="475" dy="26">独立的数据策略</tspan></text><path d="M320 185 V415" class="arrow dashed" marker-end="url(#arrow)"/><path d="M165 345 V390 H260 V415" class="arrow dashed" marker-end="url(#arrow)"/><rect x="180" y="415" width="280" height="80" rx="12" class="accent"/><text x="320" y="449" class="body" text-anchor="middle"><tspan x="320" dy="0">路由进程</tspan><tspan x="320" dy="26">目标标识与消息转发</tspan></text><path d="M320 495 V540 H165 V585" class="arrow dashed" marker-end="url(#arrow)"/><path d="M320 540 H475 V585" class="arrow dashed" marker-end="url(#arrow)"/><path d="M605 637 H625 V300 H605" class="arrow dashed" marker-end="url(#arrow)"/><rect x="35" y="585" width="260" height="105" rx="12" class="box"/><text x="165" y="618.5" class="body" text-anchor="middle"><tspan x="165" dy="0">区服 A</tspan><tspan x="165" dy="26">World / Game</tspan><tspan x="165" dy="26">Proxy / Login</tspan></text><rect x="345" y="585" width="260" height="105" rx="12" class="box"/><text x="475" y="618.5" class="body" text-anchor="middle"><tspan x="475" dy="0">区服 B</tspan><tspan x="475" dy="26">World / Game</tspan><tspan x="475" dy="26">Proxy / Login</tspan></text><text x="320" y="742" class="muted" text-anchor="middle"><tspan x="320" dy="0">连接、发现与恢复策略由应用确定</tspan></text>
</svg>
