<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">历史数据模型草图</title>
  <desc id="desc">草案将实体与配置的类级和字段级元数据分开，通用值引用元数据和父级关系，并探索基础值、结构、数组和表格。所有权与迁移规则尚未确定，这不是当前运行时 API。</desc>
  <style>
    .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.boundary{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.body,.heading,.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}.body{font-size:20px}.heading{font-size:25px;font-weight:650}.muted{font-size:17px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3}.dashed{stroke-dasharray:7 5}.arrowhead{fill:#64748b}
    @media(prefers-color-scheme:dark){.canvas{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8}.accent{fill:#312e81;stroke:#a5b4fc}.body,.heading{fill:#f1f5f9}.muted{fill:#cbd5e1}.arrow{stroke:#94a3b8}.arrowhead{fill:#94a3b8}.boundary{stroke:#64748b}}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" class="arrowhead"/></marker></defs>
  <rect width="640" height="780" rx="16" class="canvas"/>
  <text x="320" y="40" class="heading" text-anchor="middle"><tspan x="320" dy="0">历史数据模型草图</tspan></text>
  <text x="320" y="82" class="muted" text-anchor="middle"><tspan x="320" dy="0">设计草案，不是运行时 API</tspan></text><rect x="25" y="135" width="280" height="125" rx="12" class="box"/><text x="165" y="178.5" class="body" text-anchor="middle"><tspan x="165" dy="0">实体元数据</tspan><tspan x="165" dy="26">类与字段定义</tspan><tspan x="165" dy="26">类型、标记与行为挂钩</tspan></text><rect x="335" y="135" width="280" height="125" rx="12" class="box"/><text x="475" y="178.5" class="body" text-anchor="middle"><tspan x="475" dy="0">配置元数据</tspan><tspan x="475" dy="26">类与字段定义</tspan><tspan x="475" dy="26">类型与引用</tspan></text><path d="M165 260 V305 H260 V350" class="arrow" marker-end="url(#arrow)"/><path d="M475 260 V305 H380 V350" class="arrow" marker-end="url(#arrow)"/><rect x="155" y="350" width="330" height="95" rx="12" class="accent"/><text x="320" y="391.5" class="body" text-anchor="middle"><tspan x="320" dy="0">通用值的设想</tspan><tspan x="320" dy="26">元数据 + 父级关系</tspan></text><path d="M320 445 V495 H165 V540" class="arrow" marker-end="url(#arrow)"/><path d="M320 495 H475 V540" class="arrow" marker-end="url(#arrow)"/><rect x="25" y="540" width="280" height="125" rx="12" class="box"/><text x="165" y="583.5" class="body" text-anchor="middle"><tspan x="165" dy="0">基础值</tspan><tspan x="165" dy="26">Boolean / 枚举</tspan><tspan x="165" dy="26">数值 / 字符串</tspan></text><rect x="335" y="540" width="280" height="125" rx="12" class="box"/><text x="475" y="596.5" class="body" text-anchor="middle"><tspan x="475" dy="0">嵌套值</tspan><tspan x="475" dy="26">结构 / 数组 / 表格</tspan></text><text x="320" y="730" class="muted" text-anchor="middle"><tspan x="320" dy="0">所有权、验证与迁移规则需要另行设计</tspan></text>
</svg>
