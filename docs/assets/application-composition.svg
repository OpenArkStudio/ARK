<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Composition within one process</title>
  <desc id="desc">An application manifest selects plugins. The manager installs modules; business modules call registered service interfaces. Application updates and arknet IO workers have separate responsibilities.</desc>
  <style>
    .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.boundary{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.body,.heading,.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}.body{font-size:20px}.heading{font-size:25px;font-weight:650}.muted{font-size:17px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3}.dashed{stroke-dasharray:7 5}.arrowhead{fill:#64748b}
    @media(prefers-color-scheme:dark){.canvas{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8}.accent{fill:#312e81;stroke:#a5b4fc}.body,.heading{fill:#f1f5f9}.muted{fill:#cbd5e1}.arrow{stroke:#94a3b8}.arrowhead{fill:#94a3b8}.boundary{stroke:#64748b}}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" class="arrowhead"/></marker></defs>
  <rect width="640" height="780" rx="16" class="canvas"/>
  <text x="320" y="40" class="heading" text-anchor="middle"><tspan x="320" dy="0">Composition within one process</tspan></text>
  <rect x="20" y="68" width="600" height="660" rx="16" class="boundary"/><text x="320" y="93" class="muted" text-anchor="middle"><tspan x="320" dy="0">Application process</tspan></text><rect x="160" y="115" width="320" height="80" rx="12" class="box"/><text x="320" y="149" class="body" text-anchor="middle"><tspan x="320" dy="0">Application manifest</tspan><tspan x="320" dy="26">Plugin names and paths</tspan></text><path d="M320 195 V235" class="arrow" marker-end="url(#arrow)"/><rect x="160" y="235" width="320" height="90" rx="12" class="accent"/><text x="320" y="274" class="body" text-anchor="middle"><tspan x="320" dy="0">plugin_manager</tspan><tspan x="320" dy="26">Lifecycle and update()</tspan></text><path d="M320 325 V350 H170 V390" class="arrow" marker-end="url(#arrow)"/><path d="M320 350 H470 V390" class="arrow" marker-end="url(#arrow)"/><rect x="40" y="390" width="260" height="110" rx="12" class="box"/><text x="170" y="426" class="body" text-anchor="middle"><tspan x="170" dy="0">Utility plugin</tspan><tspan x="170" dy="26">timer_module</tspan><tspan x="170" dy="26">guid_module</tspan></text><rect x="340" y="390" width="260" height="110" rx="12" class="box"/><text x="470" y="439" class="body" text-anchor="middle"><tspan x="470" dy="0">Business plugin</tspan><tspan x="470" dy="26">sample1_module</tspan></text><path d="M470 500 V555 H170 V500" class="arrow" marker-end="url(#arrow)"/><text x="320" y="585" class="muted" text-anchor="middle"><tspan x="320" dy="0">find_module(): direct interface calls</tspan></text><rect x="80" y="625" width="480" height="75" rx="12" class="box"/><text x="320" y="656.5" class="body" text-anchor="middle"><tspan x="320" dy="0">arknet IO workers</tspan><tspan x="320" dy="26">Separate from application updates</tspan></text>
</svg>
