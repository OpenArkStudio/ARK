<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Reference process topology</title>
  <desc id="desc">Reference roles for entry, cluster services, routing, zones and storage. Dashed connections are application choices, not a claim of implemented discovery, replication or high availability.</desc>
  <style>
    .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.boundary{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.body,.heading,.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172554}.body{font-size:20px}.heading{font-size:25px;font-weight:650}.muted{font-size:17px;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:3}.dashed{stroke-dasharray:7 5}.arrowhead{fill:#64748b}
    @media(prefers-color-scheme:dark){.canvas{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8}.accent{fill:#312e81;stroke:#a5b4fc}.body,.heading{fill:#f1f5f9}.muted{fill:#cbd5e1}.arrow{stroke:#94a3b8}.arrowhead{fill:#94a3b8}.boundary{stroke:#64748b}}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" class="arrowhead"/></marker></defs>
  <rect width="640" height="780" rx="16" class="canvas"/>
  <text x="320" y="40" class="heading" text-anchor="middle"><tspan x="320" dy="0">Reference process topology</tspan></text>
  <text x="320" y="78" class="muted" text-anchor="middle"><tspan x="320" dy="0">Role reference, not an HA deployment</tspan></text><rect x="180" y="105" width="280" height="80" rx="12" class="box"/><text x="320" y="139" class="body" text-anchor="middle"><tspan x="320" dy="0">Entry / directory</tspan><tspan x="320" dy="26">Endpoint selection</tspan></text><rect x="35" y="255" width="260" height="90" rx="12" class="box"/><text x="165" y="294" class="body" text-anchor="middle"><tspan x="165" dy="0">Cluster services</tspan><tspan x="165" dy="26">Master / shared logic</tspan></text><rect x="345" y="255" width="260" height="90" rx="12" class="box"/><text x="475" y="294" class="body" text-anchor="middle"><tspan x="475" dy="0">Storage services</tspan><tspan x="475" dy="26">Independent data policy</tspan></text><path d="M320 185 V415" class="arrow dashed" marker-end="url(#arrow)"/><path d="M165 345 V390 H260 V415" class="arrow dashed" marker-end="url(#arrow)"/><rect x="180" y="415" width="280" height="80" rx="12" class="accent"/><text x="320" y="449" class="body" text-anchor="middle"><tspan x="320" dy="0">Router</tspan><tspan x="320" dy="26">Message forwarding</tspan></text><path d="M320 495 V540 H165 V585" class="arrow dashed" marker-end="url(#arrow)"/><path d="M320 540 H475 V585" class="arrow dashed" marker-end="url(#arrow)"/><path d="M605 637 H625 V300 H605" class="arrow dashed" marker-end="url(#arrow)"/><rect x="35" y="585" width="260" height="105" rx="12" class="box"/><text x="165" y="618.5" class="body" text-anchor="middle"><tspan x="165" dy="0">Zone A</tspan><tspan x="165" dy="26">World / Game</tspan><tspan x="165" dy="26">Proxy / Login</tspan></text><rect x="345" y="585" width="260" height="105" rx="12" class="box"/><text x="475" y="618.5" class="body" text-anchor="middle"><tspan x="475" dy="0">Zone B</tspan><tspan x="475" dy="26">World / Game</tspan><tspan x="475" dy="26">Proxy / Login</tspan></text><text x="320" y="742" class="muted" text-anchor="middle"><tspan x="320" dy="0">Applications choose connections and recovery</tspan></text>
</svg>
