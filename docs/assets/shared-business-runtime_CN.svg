<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc"><title id="title">模块任务与共享业务执行器</title><desc id="desc">所有任务组共用一次 handler 预算；原生 IO 线程不直接恢复业务协程。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#496d96"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#19324d;font-size:15px}.small{font-size:12px;fill:#46617b}.box{fill:#f5f8fc;stroke:#7694b5;stroke-width:1.5}.arrow{fill:none;stroke:#496d96;stroke-width:1.8;marker-end:url(#arrow)}</style><rect x="260" y="22" width="680" height="182" rx="12" fill="#edf5ff" stroke="#7694b5"/><text x="280" y="51">ark 主循环 / 所属线程</text><rect class="box" x="15" y="83" width="184" height="100" rx="10"/><text x="107" y="121" text-anchor="middle">arknet 原生 IO</text><text class="small" x="107" y="148" text-anchor="middle">连接池所属工作线程</text><rect class="box" x="280" y="83" width="245" height="100" rx="10"/><text x="402" y="121" text-anchor="middle">模块 update()</text><text class="small" x="402" y="148" text-anchor="middle">service.update() → bridge.dispatch()</text><rect class="box" x="565" y="83" width="185" height="100" rx="10"/><text x="657" y="121" text-anchor="middle">共享 manual_runtime</text><text class="small" x="657" y="148" text-anchor="middle">每 tick 一次有界 poll()</text><rect class="box" x="790" y="83" width="130" height="100" rx="10"/><text x="855" y="121" text-anchor="middle">模块任务组</text><text class="small" x="855" y="148" text-anchor="middle">恢复 co_await</text><path class="arrow" d="M199 133H280"/><text class="small" x="237" y="116" text-anchor="middle">完成结果</text><path class="arrow" d="M525 133H565"/><path class="arrow" d="M750 133H790"/><text class="small" x="480" y="239" text-anchor="middle">所有任务组共用一次 handler 预算；原生 IO 线程不直接恢复业务协程。</text></svg>
