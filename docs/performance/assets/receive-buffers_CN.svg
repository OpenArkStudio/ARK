<text x="410" y="222" text-anchor="middle" class="muted">8.0</text>
<text x="410" y="240" text-anchor="end" class="muted">M msg/s</text></g>
<g transform="translate(20 350)"><rect width="440" height="250" rx="12" fill="white" stroke="#e2e8f0"/>
