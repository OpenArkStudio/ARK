<text x="18" y="49" class="muted">输入块 1 B；每批 1 条</text>
<text x="18" y="102" font-size="12">原实现</text>
<text x="410" y="75" text-anchor="end" font-size="13" font-weight="600">12.89 k msg/s</text>
